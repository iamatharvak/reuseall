name: reuseall_rider
description: A rider app for ReuseAll to manage pickup routes and navigation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.5
  
  # Maps & Location
  google_maps_flutter: ^2.3.0
  geolocator: ^9.0.2
  flutter_polyline_points: ^1.0.0
  permission_handler: ^11.0.0
  
  # Navigation
  url_launcher: ^6.1.11
  maps_launcher: ^2.2.1
  
  # State Management
  provider: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  # assets: 
    # - "assets/images/"